name: Remove old snapshots

on:
  workflow_call:

jobs:
  list-and-remove-old-snapshots-tag-and-assets:
    runs-on: ubuntu-latest
    concurrency:
      group: cleanup-snapshots
      cancel-in-progress: false
      queue: single
    permissions:
      contents: write
      packages: write

    steps:
      - name: Identify snapshots to delete
        id: snapshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Identify the oldest snapshots, while keeping the 8 most recent ones
          # It means ignoring index (0-7)

          snapshots=$(gh release list --repo $GITHUB_REPOSITORY --limit 1000 --json tagName,publishedAt \
            --jq '[
              .[]
              | select(.tagName | startswith("snapshot-"))
            ]
            | sort_by(.publishedAt)
            | reverse
            | .[8:]
            | .[].tagName')
          echo "tags=${snapshots//$'\n'/ }" | tee -a "$GITHUB_OUTPUT"

      - name: Identify and delete snapshot images in GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOTS_TO_DELETE: ${{ steps.snapshots.outputs.tags }}
        shell: bash
        run: |
          echo "SNAPSHOTS_TO_DELETE=${SNAPSHOTS_TO_DELETE}"

          gh api --paginate \
            "/orgs/${{ github.repository_owner }}/packages/container/alumet-agent/versions?per_page=100" \
          > ${{ runner.temp }}/raw_request_version_ids.json

          # Iterate over previously identified snapshots
          for tag in $SNAPSHOTS_TO_DELETE; do
            # Ignore empty lines
            [ -z "$tag" ] && continue
            # Extract the date : snapshot-20261026 -> 20261026.
            date="${tag#snapshot-}"
            # Check format before searching
            if [[ ! "$date" =~ ^[0-9]{8}$ ]]; then
              echo "::warning::Unexpected snapshot tag: $tag"
              continue
            fi
            # Example : 0.9.5-20261026.giteb82639-1_ubuntu_24.04
            pattern="-${date}."
            echo "Searching GHCR images for snapshot: $tag"

            # Search GHCR versions containing a tag corresponding to the date

            version_ids=$(
              jq ".[]
                | select(any(
                  .metadata.container.tags[]?;contains(\"$pattern\")
                  ))
                | .id" \
              ${{ runner.temp }}/raw_request_version_ids.json | sort -u
            )

            echo "version_ids=$version_ids"

            # No image found, go to next one
            if [ -z "$version_ids" ]; then
              echo "No GHCR images found for $tag"
              continue
            fi

            # Delete
            for version_id in $version_ids; do
              [ -z "$version_id" ] && continue
              echo "Try to delete GHCR version $version_id for tag: $tag"

              if ! gh api --method DELETE "/orgs/${{ github.repository_owner }}/packages/container/alumet-agent/versions/$version_id"; then
                echo "::error::failed to delete $version_id for tag: $tag : the pre-release snapshots will not be deleted"
                exit_status=1
              fi

            done
          done
          exit "${exit_status:-0}"

      - name: Delete old snapshots
        shell: bash
        env:
          SNAPSHOTS_TO_DELETE: ${{ steps.snapshots.outputs.tags }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For each tag identified at the previous step delete the release
          for tag in $SNAPSHOTS_TO_DELETE; do
            # Ignore empty lines.
            [ -z "$tag" ] && continue
            echo "delete snapshot (pre-release): $tag"
            # We want to keep the tag to rebuild it if necessary so no need to use --cleanup-tag
            gh release delete "$tag" --yes --repo $GITHUB_REPOSITORY
          done
