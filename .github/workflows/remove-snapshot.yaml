name: Remove old snapshots

on:
  # TODO remove after change validated
  push:
    branches: ["BRSEED-1680/Add-an-automatic-cleanup-of-old-snapshots-in-alumet-repo"]
  workflow_call:

jobs:
    list-and-remove-old-snapshots-tag-and-assets:
      runs-on: ubuntu-latest
      concurrency:
        group: cleanup-snapshots
        cancel-in-progress: false
        queue: single
      permissions:
        contents: write
        packages: write

      steps:
      # TODO remove if not needed
      #  - name: Checkout repo
      #    uses: actions/checkout@v7
      #    with:
      #      fetch-depth: 0
      #      ref: main

        - name: Identify snapshots to delete
          id: snapshots
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            # Identify the oldest snapshots, while keeping the 7 most recent ones
            # It means ignoring index (0-6)

            snapshots=$(gh release list --repo $GITHUB_REPOSITORY --limit 1000 --json tagName,publishedAt \
              --jq '[
                .[]
                | select(.tagName | startswith("snapshot-"))
              ]
              | sort_by(.publishedAt)
              | reverse
              | .[7:]
              | .[].tagName')
            {
              echo "tags<<EOF"
              echo "$snapshots"
              echo "EOF"
            } | tee -a "$GITHUB_OUTPUT"

        - name: Identify and delete snapshot images in GHCR
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SNAPSHOTS_TO_DELETE: ${{ steps.snapshots.outputs.tags }}
          shell: bash
          run: |
            # Iterate over previously identified snapshots
            while IFS= read -r tag; do
              # Ignore empty lines
              [ -z "$tag" ] && continue
              # Extract the date : snapshot-20261026 -> 20261026.
              date="${tag#snapshot-}"
              # Check format before searching
              if [[ ! "$date" =~ ^[0-9]{8}$ ]]; then
                echo "::warning::Unexpected snapshot tag: $tag"
                continue
              fi
              # Example : 0.9.5-20261026.giteb82639-1_ubuntu_24.04
              pattern="-${date}."
              echo "Searching GHCR images for snapshot: $tag"

              # Search GHCR versions containing a tag corresponding to the date

              version_ids=$(
              gh api --paginate \
                "/orgs/alumet-dev/packages/container/alumet-agent/versions?per_page=100" \
                --jq "
                  .[]
                  | select(any(
                      .metadata.container.tags[]?;
                      contains(\"$pattern\")
                    ))
                  | .id
                " | sort -u
              )
              echo "version_ids=$version_ids"

              # No image found, go to next one
              if [ -z "$version_ids" ]; then
                echo "No GHCR images found for $tag"
                continue
              fi

              # Delete
              while IFS= read -r version_id; do
                [ -z "$version_id" ] && continue
                echo "Deleting GHCR version $version_id for tag: $tag"
                gh api --method DELETE "/orgs/alumet-dev/packages/container/alumet-agent/versions/$version_id"
              done <<< "$version_ids"
            done <<< "$SNAPSHOTS_TO_DELETE"

        - name: Delete old snapshots
          shell: bash
          env:
            SNAPSHOTS_TO_DELETE: ${{ steps.snapshots.outputs.tags }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            # For each tag identified at the snapshots step delete the release
            while IFS= read -r tag; do
              # Ignore empty lines.
              [ -z "$tag" ] && continue
              echo "delete snapshot (pre-release): $tag"
              # We want to keep the tag to rebuild it if necessary so no need to use --cleanup-tag
              gh release delete "$tag" --yes --repo $GITHUB_REPOSITORY
            done <<< "$SNAPSHOTS_TO_DELETE"
