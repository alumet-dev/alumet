[package]
name = "plugin-nvidia-nvml"
version = "0.8.0"
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
alumet.workspace = true
anyhow.workspace = true
humantime-serde.workspace = true
log.workspace = true
nvml-wrapper = {version = "0.13.0", features = ["legacy-functions","serde"] }
nvml-wrapper-sys = {version = "0.10.0" }
mockall = { version = "0.14.0", optional = true }
serde = { workspace = true, features = ["derive"] }

[features]
# Exposes mocks of the NVML library, to test the plugin without a GPU.
mock = ["dep:mockall"]

[dev-dependencies]
plugin-nvidia-nvml = { path = ".", features = ["mock"] }
pretty_assertions.workspace = true
toml.workspace = true
tempfile.workspace = true
mockall = {version = "0.14.0" }
alumet = { workspace = true, features = ["test"]}
insta = "1.49.0"

[lints]
workspace = true
